name: airbnb_cybersoft
description: "Bài tập cuối khóa Flutter tại Cybersoft"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  google_fonts: ^9.0.0
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  sqflite: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/navbar_icon/
    - assets/icons/category_icon/
    - assets/icons/appbar_icon/
    - assets/icons/detail_room_icon/

